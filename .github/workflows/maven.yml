name: Zomato Clone CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Download your code from the repository
      - uses: actions/checkout@v3

      # 2. Install Java 21 (The version we are using)
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven # Caches libraries so subsequent builds are faster

      # 3. The "Exam": Build the project and run ALL tests
      - name: Build with Maven
        run: mvn -B package --file pom.xml

      # 4. (Optional) Upload the built JAR file so you can download it
      - name: Upload Artifact
        uses: actions/upload-artifact@v3
        with:
          name: zomato-clone-jar
          path: target/*.jar