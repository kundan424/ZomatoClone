<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>Zomato Clone API Docs</title>

    <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist/swagger-ui.css" />
    <link rel="icon" type="image/png" href="https://unpkg.com/swagger-ui-dist/favicon-32x32.png" />

    <style>
        body {
            margin: 0;
            background: #fafafa;
        }
    </style>
</head>

<body>

<!-- 👇 ADD YOUR HEADER HERE -->
<h2 style="text-align:center; font-family: Arial ; margin:20px 0;">
    Zomato Clone REST API Documentation
</h2>

<!-- Swagger UI renders inside this div -->
<div id="swagger-ui"></div>

<script src="https://unpkg.com/swagger-ui-dist/swagger-ui-bundle.js"></script>
<script src="https://unpkg.com/swagger-ui-dist/swagger-ui-standalone-preset.js"></script>

<script>
    window.onload = () => {
        window.ui = SwaggerUIBundle({
            url: "openapi.json",
            dom_id: "#swagger-ui",
            deepLinking: true,
            presets: [
                SwaggerUIBundle.presets.apis,
                SwaggerUIStandalonePreset
            ],
            layout: "StandaloneLayout"
        });
    };
</script>

</body>
</html>
